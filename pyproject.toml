[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cg-param-m3"
version = "0.1.0"
description = "Coarse-grained molecular parameterization using M3 mapping"
readme = "README.md"
authors = [{ name = "Your Name" }]
license = { text = "MIT" }
requires-python = ">=3.9"

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "requests",
    "rdkit",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
cg-param-m3 = "cg_param_m3.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cg_param_m3 = ["data/*.dat"]