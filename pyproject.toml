[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cgparam"
version = "0.1.0"
description = "Coarse-grained molecular parameterization using M3 mapping"
readme = "README.md"
license = { text = "LGPL, GPL" }
requires-python = ">=3.9"

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "requests",
    "rdkit",
    "ipykernel",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
cgparam = "cgparam.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"cgparam" = ["data/*.dat"]
